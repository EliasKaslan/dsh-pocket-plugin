# DSH 随行（dsh-pocket-plugin）· 插件行  ·  v1.0.1
#
# 作为一个 DSH bundle 安装时，这一行由 bundle 自带，无需手写。
# 用 `dsh plugin add <源>` 安装后，profile 的 package.json 会多一条依赖，
# 这一行里的 `name` 由 DSH 从 profile 的 node_modules 解析。
#
# 手写安装（例如直接 `link:` 本地目录）时，把这段复制进
# `$DSH_HOME/profiles/<profile>/cordis.patch.yml` 的顶层数组即可。
#
# 只有一条通路：桌面端固定监听 127.0.0.1，局域网直连不存在；手机走
# 「加密中继外壳 + 账号 + 口令」。登录一次即自动登记设备并保持 15 天免密，
# 没有配对码这一步。
- insert:
    - id: pocket
      # 必须与 package.json 的 "name" 完全一致，否则加载不到。
      name: 'dsh-pocket-plugin'
      config:
        # 回环桥接端口；被占用时自动顺延（47901 → 47902 → …）。
        # 监听地址不可配，恒为 127.0.0.1。
        port: 47901
        # 手机端显示的电脑名。留空则显示「我的电脑」（不会泄露主机名）
        serverName: ''
        # 二维码 PNG 的落点。留空 = 用户个人目录下的固定文件名
        # （~/.dsh-pocket-qr.png 的兄弟：~/dsh-pocket-qr.png）。
        # 想让二维码出现在别处就填绝对路径；填 false 则不写文件
        # （仍然可以在 http://127.0.0.1:<port>/pair 页面上看到二维码）。
        qrFile: ''
        cloud:
          # 中继是唯一的对外通路，但它默认关闭。开启要同时满足两个前提，
          # 缺一个都起不来 —— 这是有意的 fail-closed：
          #   1) 设过访问口令（`node tools/set-auth.mjs --user 你的名字`）；
          #   2) `appBase` 填了你自己托管的手机端外壳地址。
          enabled: false
          # 手机端静态外壳的地址。**故意留空**：外壳是一段会在你手机上执行的
          # 代码，把某个第三方地址写成默认值，等于让每一次安装都去信任同一个人
          # 的账号。填好才能连上：
          #   node tools/build-shell.mjs        # 生成 docs/
          #   把 docs/ 发布到任意静态托管        # GitHub Pages / OSS / 自己的站
          #   把地址填到这里（结尾带 /）
          appBase: ''
          # 公共 MQTT broker（只承载密文，broker 看不到明文，但能看到元数据）。
          # 可换成自建 broker：wss://your-broker.example.com:8084/mqtt
          # 也支持数组（最多 4 个，按顺序回退）。
          broker: 'wss://broker-cn.emqx.io:8084/mqtt'
